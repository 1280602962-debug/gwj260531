name: revision-validate

on:
  push:
    paths:
      - Dual_Target_Docking/**
      - .github/workflows/revision-validate.yml
  pull_request:
    paths:
      - Dual_Target_Docking/**
      - .github/workflows/revision-validate.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dual_Target_Docking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-analysis.txt || pip install numpy pandas matplotlib scipy scikit-learn
      - name: Analysis environment
        run: python3 scripts/check_analysis_env.py
      - name: Post-fix smoke
        run: python3 scripts/audit/smoke_postfix_v4.py
      - name: Post-fix canonical validation
        run: python3 scripts/audit/validate_postfix_v4.py
      - name: Canonical checksums (raw SHA256)
        run: python3 scripts/audit/check_canonical_checksums_v2.py
      - name: Submission pack hash parity
        run: python3 scripts/audit/check_submission_pack_v4.py
      # Any step above that exits non-zero fails the job (GitHub Actions default).
