name: revision-validate

on:
  push:
    paths:
      - Dual_Target_Docking/**
      - .github/workflows/revision-validate.yml
  pull_request:
    paths:
      - Dual_Target_Docking/**
      - .github/workflows/revision-validate.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dual_Target_Docking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip && pip install numpy pandas matplotlib scipy scikit-learn rdkit
      - name: Environment check
        run: python3 scripts/check_local_env.py
      - name: Revision numeric checks
        run: python3 data/jcim_novelty_v0/scripts/validate_revision_v1.py
      - name: Checksum manifest
        run: python3 data/jcim_novelty_v0/scripts/build_checksum_manifest_v1.py --check
