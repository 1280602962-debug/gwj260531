# C1 L2 CPU smoke engine config.
# Same schema as docking_c1.yaml but no_gpu: true (this machine has no NVIDIA GPU).
# Do NOT use for L3 full decoy.

default_engine: gnina

gnina:
  binary: gnina
  no_gpu: true
  exhaustiveness: 32
  num_modes: 9
  cpu: 4
  cnn_scoring: rescore
  score_mode: cnnaff
  # seed overridden per-run via extra_args in the L2 driver
  extra_args: ["--seed", "42"]

receptor_prep:
  remove_waters: true
  remove_hetatm: true
  protonate_ph: 7.4
  chain: A

targets:
  urat1_9dkb:
    pdb_id: 9DKB
    structure_file: data/structures/pdb/9DKB.cif
    ligand_resn: A1AIL
    center: [99.966, 102.967, 105.699]
    size: [22, 22, 22]
    prepared_receptor: data/structures/prepared/9DKB_receptor.pdbqt

  nlrp3_7alv:
    pdb_id: 7ALV
    structure_file: data/structures/pdb/7ALV.pdb
    ligand_resn: RM5
    center: [16.756, 35.449, 125.714]
    size: [20, 20, 20]
    prepared_receptor: data/structures/prepared/7ALV_receptor.pdbqt
