# campaign C5 — dual-node candidate publication lock
# Route doc: docs/PROJECT_ROUTE_C5_DUAL_NODE_PUBLICATION.md
# Supersedes C2/C3/C4 as the single active spine. C1 acid-track assets are inherited.
# This file is the scientific pre-registration. It is NOT a drop-in --config for run_gnina_batch.py.
# Engine yaml stays config/docking_c1.yaml (identical gnina parameters as C1).

name: C5
status: planned_gates_locked_before_new_names
supersedes: [C2, C3, C4]
inherits_from: C1
journal_target: Molecular Diversity

product_claim: >
  putative URAT1-NLRP3 dual-node candidate hypotheses from clinical-stage acid
  pharmacophores, with retrospectively calibrated gates on both arms.
  Docking scores are never interpreted as affinity. No wet-lab validation.

forbidden_claims:
  - dual inhibitors
  - validated / confirmed binder
  - docking score as affinity or Ki
  - NACHT pocket binder for pathway-only evidence
  - selectivity claim from OAT1 counter-dock

frozen_do_not_overwrite:
  - data/repurposing/p2/
  - data/campaigns/c1/07_clinical_dock/acid_dual_a1_frozen/
  - data/si/
  - data/campaigns/c1/05_metrics/acid_gate_retrospective_benchmark/

rank_track:
  status: closed
  reason: lesinurad free-dock CNNscore-selected RMSD 4.30/4.31/4.88 A (seeds 42/43/44)
  allow_L3_full_decoy: false
  role_in_paper: supplementary_limitation_only

# ---------------------------------------------------------------- W1
w1_urat1_crossdock:
  purpose: pose-fidelity as a function of ligand flexibility (not ranking)
  reference: "Suo/Fedor/Lee Nat. Commun. 2025, 16:5178 (verified via RCSB entry API: DOI 10.1038/s41467-025-60480-3, PubMed 40467597)"
  environment_note: >
    structure files ARE fetchable from this cloud sandbox (curl files.rcsb.org
    works; rdkit/pandas/scipy installable via pip --user). Only the gnina
    docking run itself requires the user's local machine (no gnina binary here).
  receptors:
    - {pdb: 9DK9, state: apo,  resolution_A: 2.68, ligand: null}
    - {pdb: 9DKA, state: holo, resolution_A: 3.00, ligand: R75,   ligand_name: benzbromarone}
    - {pdb: 9DKB, state: holo, resolution_A: 2.74, ligand: A1AIL, ligand_name: lesinurad}  # verified via RCSB chemcomp API; docs previously said LES (wrong)
    - {pdb: 9DKC, state: holo, resolution_A: 2.55, ligand: A1A45, ligand_name: TD-3}
  design: 3_crystal_ligands x 4_receptors x 3_seeds
  n_jobs_total: 36
  n_jobs_reusable: 4   # lesinurad@9DKB seeds 42/43/44 + benzbromarone@9DKB seed42
  n_jobs_new: 32
  worklist: docs/C5_DOCKING_WORKLIST.md
  engine_yaml: config/docking_c5_w1.yaml   # identical gnina params; adds 9DK9/9DKA/9DKC boxes
  box_provenance: data/campaigns/c5/00_verification/w1_box_centers.json
  boxes:
    - {pdb: 9DKB, center: [99.966, 102.967, 105.699], size: [22, 22, 22], rule: locked_production}
    - {pdb: 9DKA, center: [107.167, 105.296, 107.628], size: [22, 22, 22], rule: R75_heavy_atom_centroid}
    - {pdb: 9DKC, center: [102.345, 103.269, 107.416], size: [22, 22, 22], rule: A1A45_heavy_atom_centroid}
    - {pdb: 9DK9, center: [100.693, 107.700, 105.653], size: [22, 22, 22], rule: transfer_9DKB_locked_after_chainA_CA_Kabsch}
  seeds: [42, 43, 44]
  report: [rmsd_top1, rmsd_top3, rmsd_best_of_9, acid_O_Arg477_N_min_A]
  reference_ligand_rotatable_bonds_rdkit_verified:
    lesinurad: 5
    benzbromarone: 3
    TD-3: 5   # same as lesinurad -- NOT a rigid control, shares the thioether-carboxylate swivel arm
  pass_rule:
    receptor_prep_sanity_control: benzbromarone   # the only ligand independent of the flexibility hypothesis
    receptor_prep_sanity_top1_le_A: 2.0
    td3_role: flexibility_hypothesis_replicate_not_contrast   # TD-3 failing CORROBORATES the flexibility explanation
  on_fail: stop_and_audit_receptor_prep    # do not proceed to W2
  gate_status: failed_pending_audit
  gate_result_user_reported_2026-09-05:
    ligand: benzbromarone
    receptor: 9DKA
    seeds: [42, 43, 44]
    readout: CNNscore_top1_heavy_atom_rmsd_vs_crystal_R75
    rmsd_A: [3.59, 3.60]   # user-reported range; deposit per-seed 9-mode tables before interpreting
    threshold_A: 2.0
    remaining_29_not_started: true
    w4_not_started: true
    w2_not_started: true
    forbid_after_seeing_number:
      - raise_threshold_to_4A
      - treat_3p6_as_pass
      - start_remaining_29_as_if_gate_passed
      - start_w2_on_failed_selfdock_poses
  audit_required_before_any_new_gnina:
    on_existing_sdfs_zero_new_dock:
      - per_seed_all_9_mode_rmsd_top1_top3min_bestof9
      - confirm_box_was_9DKA_native_107.167_105.296_107.628_not_9DKB
      - confirm_prepared_receptor_has_no_R75
      - confirm_ligand_pdbqt_is_frozen_phenolate
      - symmetry_corrected_heavy_atom_rmsd
    diagnostic_gnina_only_if_audit_files_are_clean:
      - phenol_vs_phenolate_seed42
      - local_only_minimize_from_crystal_R75
    after_audit:
      prep_bug: fix_and_rerun_gate_3_seeds_only
      search_ok_selection_fail: keep_gate_fail; w2_anchor_from_crystal_poses_not_selfdock; w4_may_start
      pocket_cannot_hold_crystal: stop_urat1_free_dock_story; crystal_IFP_only; do_not_run_remaining_29
  residue_numbering_hazard: >
    data/campaigns/c1/01_ligand_prep/selfdock_refs/arg477_coords.json documents a
    +/-1 numbering offset between literature residue numbers and the prepared
    receptor PDBQT (Arg477 -> ARG A 476). Verify every key residue individually
    in W2, do not bulk-copy literature numbering.

# ---------------------------------------------------------------- W2
w2_urat1_acid_anchor_ifp_gate:
  purpose: make the URAT1 arm structurally symmetric to the NLRP3 arm
  rationale: >
    the current URAT1 gate is a single Arg477 distance; as the A2 rule it scores
    OR ~= 0.97 (p = 1.0) on the retrospective acid benchmark and therefore
    cannot discriminate activity. An IFP-based gate is calibrated instead.
  key_residue_source: literature-anchored, NOT geometry-derived (mirrors how the
    NLRP3 key-residue set was built from Dekker 2021, not tuned post hoc)
  key_residues: [S35, M214, F241, F360, F364, F365, D389, K393, Q437, F449, R477, Q473]
  key_residue_literature:
    - "Tan et al. Sci. Rep. 2017, 7:665 (fold-change: verinurad, benzbromarone, sulfinpyrazone, probenecid)"
    - "Guo/Chen Nat. Commun. 2025, 16:1512 (S35Q, R477N, D389A, F360T mutants)"
    - "Dai & Lee Cell Res. 2024 (five-Phe cage F241/F360/F364/F365/F449)"
  numbering_caveat: each residue must be individually re-verified against the
    prepared-receptor PDBQT numbering (see w1 residue_numbering_hazard), not
    bulk-copied from literature numbering.
  gate_components: [acid_O_Arg477_N_min_A, heavy_atom_pocket_overlap, key_residue_ifp_jaccard, no_clash]
  clash_A: 2.2
  calibration:
    benchmark: 228 carboxylate actives vs 64 carboxylate true decoys
    source: data/campaigns/c1/05_metrics/acid_gate_retrospective_benchmark/
    reuse_phase1_9mode_sdf: true     # no re-docking
    script: scripts/run_acid_gate_benchmark.py
    method: anchor_from_selfdock_do_not_grid_search
    method_rationale: >
      grid-searching thresholds to maximize OR/CI on the SAME 228-vs-64 set that
      is then reported as the significance test is data peeping -- the same
      methodological error the project already forbids elsewhere ("train ML on
      decoy labels for protocol selection"). Thresholds must instead be anchored
      to the crystal self-dock overlap/IFP/contact values (as NLRP3's gate was:
      anchored below NP3-146 self-dock, overlap~=1.0, IFP~=0.84-1.0, contacts
      6-7/7), then evaluated ONCE on the benchmark, no re-tuning after seeing p.
  pass_rule:
    odds_ratio_ci95_low_gt: 1.0
  on_fail:
    fallback: intersect_A1_discriminative_and_A2_admissibility
    a1_reference: {odds_ratio: 3.1758, ci95: [1.7728, 6.8088], fisher_p: 4.4959e-4}
    forbid: inventing_new_metrics_to_replace_a_gate_that_already_works

# ---------------------------------------------------------------- W3
w3_tiering:
  requires_no_new_docking: true
  status: computed_2026-09-04   # no longer a placeholder
  script: scripts/build_c5_tier_assignment.py
  tier1:
    - a1_rule_pass                # CNNscore top-1 pose is itself geometry-compatible
    - a2_rule_pass                # a geometry-compatible pose exists (admissibility)
    - dual_structural_in_ge_2_of_3_seeds
    - chemistry_audit_pass
  tier2:
    - a2_rule_pass
    - dual_structural_in_ge_2_of_3_seeds
    - chemistry_audit_pass
  tier3_excluded_from_table: loose_gate_only
  inherited_counts:
    a1_clinical_dual_keep_seed42: 24
    a2_dual_loose_ge_2of3: 59
    a2_dual_structural_ge_2of3: 54
    a2_dual_structural_3of3: 38
    eligible_after_chemistry_audit: 40
  verified_output:
    tier1_n: 13   # includes GSK-3008348 as structural-control-not-candidate -> 12 true candidates
    tier2_n: 24   # includes 3 beta-lactam (cephalosporin) hits that must be excluded before use, see m4
    tier1_overlap_with_old_hand_curated_shortlist: 5   # Lanifibranor, Admilparant, PF-03882845, PSI-697, GSK-3008348
    pf_04620110_in_tier1_or_tier2: false   # mechanically excluded, consistent with m3
    output_files:
      - data/campaigns/c5/03_tiering/tier1_candidates.csv
      - data/campaigns/c5/03_tiering/tier2_candidates.csv
      - data/campaigns/c5/03_tiering/tier_summary.json
  superseded_file: data/campaigns/c1/08_nomination/acid_shortlist_a2_competition.csv
  superseded_reason: >
    that file's primary/backup tiers were hardcoded ligand-name lists
    (PRIMARY_TIER1/PRIMARY_TIER2/BACKUP_TIER in build_c1_acid_shortlist_a2.py),
    not gate-derived. PF-04620110 was never actually selected by any structural
    gate; it was a hardcoded name being scored, not screened.

# ---------------------------------------------------------------- W4
w4_nlrp3_panel_rebuild:
  fixes:
    m1_dedupe: >
      CHEMBL3183703 == MCC950 (identical SMILES, verified by string comparison);
      positives 10 -> 9. Fisher p recomputed with scipy.stats.fisher_exact:
      0.01340 (n=10, frozen) -> 0.02703 (n=9, deduped). Still significant but
      ~2x weaker; report 0.02703, not the frozen 0.01340.
    m2_recalibrate: >
      verified row-by-row on all 30 rows of nlrp3_panel_metrics_seed42.csv:
      keep_nlrp3_pose == keep_nlrp3_structural on every single row. The
      structural gate adds exactly zero discrimination on this panel (not
      "approximately zero" -- literally identical pass/fail on every ligand).
      Retune thresholds on the rebuilt (larger, harder) panel or demote to
      "pose QC" in the text.
  positives: 9   # NP3-146, MCC950, ChEMBL sulfonylurea actives (deduped)
  exhaustiveness: 32   # do NOT reuse the seed42 panel SDFs that were docked at exhaustiveness=8
  receptor: 7ALV
  box: {center: [16.756, 35.449, 125.714], size: [20, 20, 20]}
  background:
    clinical_acids: 20
    reuse_clinical_poses_exh32: true
    missing_jobs: [{ligand: REP_07837, seeds: [43, 44], receptor: 7ALV}]
    property_matched_decoys_min: 40
    decoy_rule_max_morgan_tc_vs_nlrp3_actives_le: 0.5
    decoy_source: data/benchmarks/urat1_true_decoy/true_decoys.csv
    do_not_name_decoys_by_hand: true
  n_jobs_new_min: 146   # 8 positives x 3 + 40 decoys x 3 + REP_07837 seeds 43/44
  seeds: [42, 43, 44]
  gate_components: [pocket_overlap, key_residue_ifp_jaccard, key_contacts_recovered, no_clash]
  reference_thresholds_c1:
    overlap_ge: 0.50
    ifp_jaccard_ge: 0.50
    key_contacts_ge: 5             # of 7
  pass_rule:
    structural_gate_specificity_gt_loose_gate: true
    fisher_p_lt: 0.05
  on_fail: report_as_pose_qc_not_structural_compatibility_gate
  threshold_freeze: before_reading_clinical_names
  script: scripts/run_nlrp3_structural_panel.py

# ---------------------------------------------------------------- M3
m3_shortlist_correction:
  root_cause_verified: >
    deeper than initially assessed: the entire primary/backup tiering in the
    superseded file was a hardcoded name list in build_c1_acid_shortlist_a2.py,
    not a gate output. Fixed by discarding that script's tiering logic and
    using scripts/build_c5_tier_assignment.py (pure set intersection, no names).
  primary_requires: dual_structural_3of3_or_documented_2of3
  demote_from_primary:
    - name: PF-04620110
      reason: NLRP3 structural gate fails on all 3 seeds (overlap 0.48, IFP 0.45, contacts 4/7)
      allowed_language: pathway-supported, pocket-accessible only; not NP3-146-mode recovery
      verified: mechanically absent from both tier1 and tier2 in the rebuilt assignment
  structural_control_not_candidate:
    - GSK-3008348 FREE BASE
  never_in_candidate_table:
    - VECABRUTINIB
    - ZELENIRSTAT
    - DEUCRICTIBANT
    - PRALICIGUAT
    - MLN-0415
    - BI 653048

# ---------------------------------------------------------------- M4 (found during 2026-09-04 verification)
m4_chemistry_soft_exclude_is_a_namelist:
  finding: >
    SOFT_EXCLUDE_SUBSTR in build_c1_acid_shortlist_a2.py hardcodes 3 specific
    cephalosporin names (CEFCANEL, CEFAZAFLUR, CEFOVECIN), not a beta-lactam
    substructure filter. 3 other cephalosporins (Cefetrizole, Cefazedone,
    Cefoxazole) slipped into tier2 (verified via beta-lactam SMARTS).
  fix: use a structural filter, not a name list
  smarts: "[#6]1[#6][#7][#6]1=O"
  implemented_in: scripts/build_c5_tier_assignment.py (beta_lactam_flag column)
  action_required: exclude beta_lactam_flag==true rows before using tier2 as
    W5 backup MD candidates or reporting tier2 in the manuscript

# ---------------------------------------------------------------- W5
w5_md:
  md_authorized: false
  authorize_after: [w1, w2, w3, w4, m3, shortlist_freeze]
  controls_always_included:
    - {system: lesinurad_crystal_acid_pose, receptor: 9DKB, membrane: POPC}
    - {system: NP3_146_cocrystal_pose,      receptor: 7ALV, membrane: none}
  discovery_slots: 2-3             # from tier1 only
  replicas: 3
  production_ns: 200
  readouts_urat1: [acid_Arg477_saltbridge_occupancy_pct, key_contact_persistence_pct, ligand_rmsd]
  readouts_nlrp3: [key_residue_ifp_persistence_pct, pocket_overlap_timeseries, ligand_rmsd]
  mmgbsa: relative_within_pool_only_never_affinity
  stop_rules:
    urat1: control_loses_Arg477_or_Phe_cage -> do_not_interpret_urat1_side
    nlrp3: NP3_146_drifts_out -> do_not_interpret_nlrp3_side
  forbidden: writing_trajectory_numbers_before_trajectories_exist

# ---------------------------------------------------------------- W6
w6_oat1_counterscreen:
  status: optional_recommended
  role: exclusion_annotation_only
  receptors:
    - {ref: "Jeon Structure 2025", states: [apo, olmesartan, probenecid]}
    - {ref: "Wu & Luo Sci. Adv. 2025", states: [cidofovir]}
  calibration_reference: >
    Taniguchi JPET 2019 same-assay matrix (dotinurad ~110x, benzbromarone 16.5x,
    lesinurad 0.23x, probenecid 0.066x)
  output: predicted_secretory_OAT_counter_target_liability
  constraints:
    - nlrp3_remains_second_node
    - one_table_plus_one_discussion_paragraph
    - no_selectivity_ranking_claim
    - absent_from_title_and_abstract

# ---------------------------------------------------------------- do-not-do
do_not_do:
  - reopen_rank_track_or_full_decoy_docking
  - build_new_random_decoys_to_raise_EF
  - retrain_urat1_regressor_or_oat_transfer_learning
  - fep_rbfe_or_absolute_binding_free_energy
  - c2_transport_cycle_delta_score_as_method_novelty
  - generative_design_reinvent_gflownet
  - network_pharmacology_or_herbal_extract_work    # out of journal scope
  - conformal_selection_at_n_under_50
  - dft_without_a_specific_electronic_question
  - pursue_pareto_macrolides_as_leads
  - train_ml_on_decoy_labels_for_protocol_selection

execution_order: [w1_prep_now_in_sandbox, w4_m1_m2_done, m3_done, m4_done, w3_done, w1_docking_local_machine, w2, shortlist_freeze, w5, w6, rewrite_manuscript]
execution_order_note: >
