    ligand_id: REP_07580
    derivation: ranking_policy.allowed_priority_order_applied_mechanically
    why: >
      only primary-list molecule that is 3/3 on both arms AND has 7/7 NLRP3 key
      contacts in all three seeds, qN=1.0, URAT1 acid-Arg477 3.24 A with 10/11
      key contacts, and the highest QED (0.736) of the 3/3 subset.
