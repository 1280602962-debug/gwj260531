# STAD-AIDD 靶点与数据清洗配置
# 更新日期: 2026-06

targets:
  urat1:
    gene: SLC22A12
    uniprot: Q96S37
    chembl_id: CHEMBL6120
    target_class: electrochemical_transporter
    transporter_subfamily: oat   # OAT 有机阴离子/尿酸交换体（非 OCT 阳离子）
    mechanism: urate_reabsorption_inhibition   # 促尿酸排泄
  nlrp3:
    gene: NLRP3
    uniprot: Q96P20
    chembl_id: CHEMBL1741208   # ChEMBL v31 常用 ID（以 API 查询为准）
    target_class: inflammasome_sensor
    mechanism: nacht_domain_allosteric_lock     # NACHT 域变构锁定

# 辅助库：OAT/OCT（不写入当前投稿主贡献；见 data/auxiliary/README.md）
auxiliary_targets:
  slc22_oat_transfer:   # Tier A — 与 URAT1 同属 OAT 阴离子亚家族，优先用于 ML 迁移
    - gene: SLC22A6
      uniprot: O95742
      chembl_id: CHEMBL1641347   # human OAT1（勿用 CHEMBL1777665=大鼠 OAT1）
      role: primary_transfer
      note: 肾基底侧有机阴离子摄取；与 probenecid/uricosuric 化学空间重叠
    - gene: SLC22A8
      uniprot: O95816
      chembl_id: CHEMBL1641348   # human OAT3
      role: primary_transfer
      note: 肾有机阴离子分泌；与 URAT1 通路并列的肾处置环节
  slc22_oct_detargeting:   # Tier B — 阳离子转运脱靶，非主迁移来源
    - gene: SLC22A1
      uniprot: O15245
      chembl_id: CHEMBL2073664   # OCT1（勿用 CHEMBL242=ESR2、CHEMBL1906=RAF1）
      role: detargeting_tier3
      note: 肝有机阳离子摄取；对接 R_sel 与 DDI 讨论
    - gene: SLC22A2
      uniprot: O15244
      chembl_id: CHEMBL1770032   # OCT2（勿用 CHEMBL3968=PLA2G1B、CHEMBL210=ADRB2）
      role: detargeting_tier3
      note: 肾有机阳离子分泌脱靶
  # 向后兼容：旧键名指向 OAT+OCT 合并列表（脚本可读取）
  slc22_family:
    - {gene: SLC22A6, chembl_id: CHEMBL1641347, role: primary_transfer}
    - {gene: SLC22A8, chembl_id: CHEMBL1641348, role: primary_transfer}
    - {gene: SLC22A1, chembl_id: CHEMBL2073664, role: detargeting_tier3}
    - {gene: SLC22A2, chembl_id: CHEMBL1770032, role: detargeting_tier3}
  inflammasome_related:
    - gene: CASP1
      note: 下游酶，仅作机制注释，不作为主要训练靶点

data_curation:
  # 活性类型：URAT1 常见 Ki/IC50（细胞摄取抑制）；NLRP3 常见 IL-1β 释放 IC50
  standard_types: [IC50, Ki, EC50]
  standard_relation: "="
  pactivity_range: [4.0, 10.0]
  # 同一 SMILES 冲突：std > 0.5 log 或 range > 1.0 log → 丢弃
  conflict_std_threshold: 0.5
  conflict_range_threshold: 1.0
  multi_value_aggregation: median

  urat1:
    # 用户 ChEMBL 导出经清洗后约 822 条；仍建议合并专利/文献 assay
    include_patents: true
    assay_keywords_include: [urate, uric, uptake, transport, inhibition]
    min_compounds_per_assay: 5   # 数据少，适当放宽

  nlrp3:
    include_patents: true
    assay_endpoint: IL-1beta     # 仅保留 IL-1β 相关测定
    exclude_assay_keywords: [pyroptosis_only, ASC_only]
    min_compounds_per_assay: 5   # 与 scripts/00_prepare_data.py 默认一致

splits:
  method: murcko_scaffold_group   # 骨架分组，避免数据泄漏
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  n_folds: 5

benchmark_compounds:
  # 已知 URAT1 抑制剂（回顾验证用）
  urat1:
    - name: lesinurad
      chembl_id: CHEMBL3301572
      pdb_complex: 9DKB
    - name: verinurad
      pdb_complex: null
    - name: dotinurad
      pdb_complex: null
    - name: benzbromarone
      chembl_id: CHEMBL892
      pdb_complex: 9DKA
  # 已知 NLRP3 抑制剂
  nlrp3:
    - name: MCC950
      chembl_id: CHEMBL230208
      pdb_complex: 7ALV
      note: 7ALV ligand is MCC950-class analog (NP3-146), not MCC950 co-crystal
    - name: GDC-2394
      pdb_complex: 8ETR
    - name: NT-0796
      note: 脑穿透 NLRP3 抑制剂，J Med Chem 2023
