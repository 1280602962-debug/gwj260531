# STAD-AIDD 模型层级配置

foundation_models:
  primary:
    name: MiniMol
    reference: "Ahmadi et al., 2024; arXiv:2404.14986"
    params_M: 10
    pretrain_tasks: 3300
    usage: fingerprint_extraction + MLP_head
  alternatives:
    - name: Chemprop
      reference: "Heid et al., J Chem Inf Model 2024"
    - name: Graphium_GNN
      reference: "Beaini et al., ICLR 2024"

mtl_architecture:
  # 多任务学习：URAT1 + NLRP3 + 辅助 SLC22 任务
  backbone: minimol_fingerprint  # 768-dim
  heads:
    - task: urat1_pactivity
      type: regression
      loss: mse
      weight: 1.0
    - task: nlrp3_pactivity
      type: regression
      loss: mse
      weight: 1.0
    - task: dual_active
      type: classification
      loss: bce
      weight: 0.5
      label_rule: "p_urat1>=6 AND p_nlrp3>=6"
  auxiliary_pretrain:
    enabled: true
    tasks_from: slc22_family
    method: sequential_finetune  # 先 SLC22 辅助，再 URAT1/NLRP3

transfer_learning:
  # 小数据策略
  stage1: foundation_fingerprint  # 冻结 backbone
  stage2: mlp_finetune            # 仅训 head
  stage3: partial_unfreeze        # 解冻最后 1 层（可选）
  regularization:
    dropout: 0.2
    weight_decay: 1.0e-4
    early_stopping_patience: 20

cv_protocol:
  split: murcko_scaffold_groupkfold
  n_folds: 5
  metrics: [rmse, mae, r2, spearman, ef_1pct]
  significance_test: wilcoxon_signed_rank  # 与 baseline 比较

generative:
  method: rl_finetuned_clm
  base_model: molgpt_or_chemgpt
  reward_function:
    components:
      - predicted_dual_pactivity
      - urat1_ensemble_docking
      - nlrp3_ensemble_docking
      - qed
      - sa_score
      - novelty_vs_training
    reference: "POLYGON (Nature Commun 2024); CLM dual-target (Nature Commun 2024)"
  iterations: 5000
  batch_size: 64

baselines:
  - name: XGBoost_ECFP4
  - name: Chemprop_single_task
  - name: RandomForest_Morgan
  - name: Docking_only
  - name: ML_only_no_structure
