# STAD-AIDD / TAPE-GATE / MASFL 结构约束对接系综配置
# URAT1: 转运体 — 必须覆盖 inward-facing / occluded / outward-facing（三个独立 PDB）
# NLRP3: NACHT 域 — 变构抑制剂结合口袋

urat1_ensemble:
  description: >
    URAT1 抑制机制为占据底物口袋并锁定 inward-facing/occluded 构象，
    阻断交替开放转运循环（alternating access）。对接须使用构象系综而非单静态结构。

  # Teacher M-CPDL / S_trap 三态对接：每态一个 PDB → 各建 Glide grid（薛定谔不会自动分态）
  three_state_primary:
    inward_open:
      pdb_id: 9DKB
      state: inward_open
      ligand: lesinurad
      resolution_A: 2.55
      emdb: EMD-46950
      reference: "Suo Y et al., Nat Commun 2025; doi:10.1038/s41467-025-60480-3"
      grid_center: co-crystal_ligand
      role: primary_inward_for_inhibitor_docking
      alternate_inward: [9B1H, 9B1J]
    occluded:
      pdb_id: 9B1K
      state: occluded
      ligand: urate
      resolution_A: null
      emdb: EMD-44082
      reference: "Dai Y, Lee CH. Cell Res 2024; doi:10.1038/s41422-024-01023-1"
      grid_center: co-crystal_ligand_urate
      role: transport_cycle_occluded
    outward_open:
      pdb_id: 9B1L
      state: outward_open
      ligand: urate
      resolution_A: null
      emdb: EMD-44083
      reference: "Dai Y, Lee CH. Cell Res 2024; doi:10.1038/s41422-024-01023-1"
      grid_center: co-crystal_ligand_urate
      role: transport_cycle_outward

  # 完整 PDB 目录（含备用 inward 药物结构、Wu 2025 native URAT1 等）
  pdb_structures:
    - pdb_id: 9DKB
      state: inward_open
      ligand: lesinurad
      resolution_A: 2.55
      ensemble_role: three_state_primary.inward_open
      reference: "Fedor/Suo Nat Commun 2025"
    - pdb_id: 9B1H
      state: inward_open
      ligand: lesinurad
      resolution_A: 2.74
      ensemble_role: alternate_inward
      reference: "Dai et al., Cell Res 2024"
    - pdb_id: 9B1J
      state: inward_open
      ligand: urate
      resolution_A: 3.3
      ensemble_role: alternate_inward_urate
      reference: "Dai et al., Cell Res 2024; EMDB-44081"
    - pdb_id: 9B1K
      state: occluded
      ligand: urate
      ensemble_role: three_state_primary.occluded
      reference: "Dai et al., Cell Res 2024; RCSB title: occluded state"
    - pdb_id: 9B1L
      state: outward_open
      ligand: urate
      ensemble_role: three_state_primary.outward_open
      reference: "Dai et al., Cell Res 2024; RCSB title: outward-facing"
    - pdb_id: 9DKA
      state: inward_open
      ligand: benzbromarone
      resolution_A: 3.0
      ensemble_role: benchmark_redock_only
      reference: "Fedor/Suo Nat Commun 2025; NOT a generic inward grid"
    - pdb_id: 9JDZ
      state: inward_open
      ligand: lesinurad
      resolution_A: 3.5
      ensemble_role: supplementary_inward_wu2025
      reference: "Wu et al., Cell Discov 2025; lesinurad inward ONLY — not occluded/outward"
    - pdb_id: 9JDY
      state: inward_open
      ligand: verinurad
      ensemble_role: benchmark_redock_only
      reference: "Wu et al., Cell Discov 2025"
    - pdb_id: 9JE1
      state: inward_open
      ligand: dotinurad
      ensemble_role: benchmark_redock_only
      reference: "Wu et al., Cell Discov 2025"

  binding_site:
    method: co-crystal_ligand_center
    key_residues: [Phe241, Arg477, Tyr527]
    box_size_A: [22, 22, 22]
    alignment_reference: NTD_for_cross_state_overlay

  pi_scoring:
    description: >
      Per compound: Glide SP→XP on each of the three grids.
      pi_T(s|x) = softmax_s(GlideScore_s); outward score enters S_pi with negative sign.
    formula: "S_pi = pi_in + pi_occ - pi_out"

  scoring:
    components:
      - name: vina_score
        weight: 0.25
      - name: glide_sp
        weight: 0.20
        optional: true
      - name: conformation_trapping
        weight: 0.30
        description: >
          配体在 inward/occluded 结构中稳定结合且与 outward-open 态结合能差 > 阈值
      - name: key_residue_contacts
        weight: 0.15
        description: 与 Phe-rich cage、Arg477 等药效团关键残基接触
      - name: substrate_competition
        weight: 0.10
        description: 与尿酸共晶位点空间重叠（竞争性抑制）

  teacher_gate:
    lesinurad_redock_rmsd_A: 2.0
    lesinurad_redock_pdb: 9DKB
    benchmark_direction_inward_gt_outward: "4/4"
    subset_D_pi_in_plus_occ_median_lt_active: true

nlrp3_ensemble:
  description: >
    NLRP3 小分子抑制剂主要结合 NACHT 域 Walker B 附近变构口袋，
    通过分子胶机制锁定 inactive conformation。
  pdb_structures:
    - pdb_id: 7ALV
      domain: NACHT
      ligand: inhibitor
      resolution_A: 2.84
      reference: "Dekker et al., J Mol Biol 2021 (PDB 7ALV; MCC950-class analog ligand)"
    - pdb_id: 8ETR
      domain: NACHT
      ligand: GDC-2394
      method: cryo-EM
      reference: "McBride et al., J Med Chem 2022; doi:10.1021/acs.jmedchem.2c01250"
  binding_site:
    method: co-crystal_ligand_center
    subdomain: Walker_B_allosteric_pocket
    box_size_A: [20, 20, 20]
  scoring:
    components:
      - name: vina_score
        weight: 0.30
      - name: mm_gbsa
        weight: 0.25
        md_length_ns: 50
      - name: nacht_subdomain_stability
        weight: 0.25
        description: MD 后 NACHT 亚域间距离方差低 → 变构锁定
      - name: admet_filter
        weight: 0.20

dual_target_funnel:
  stage1_ml:
    urat1_pactivity_min: 5.5
    nlrp3_pactivity_min: 5.5
    dual_task_score: geometric_mean
  stage2_structure:
    urat1_ensemble_percentile: 80
    nlrp3_ensemble_percentile: 80
  stage3_synergy:
    formula: "S_dual = w1*S_URAT1 + w2*S_NLRP3 + w3*S_URAT1*S_NLRP3"
    weights: [0.35, 0.35, 0.30]
  stage4_diversity:
    method: butina_cluster
    tanimoto_cutoff: 0.4
    top_per_cluster: 3
