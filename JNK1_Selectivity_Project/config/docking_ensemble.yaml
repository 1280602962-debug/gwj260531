# Ensemble docking receptor panel for JNK1-selective virtual screening (F3)
# Curated from KLIFS + RCSB verification
# Updated 2026-04-01: JNK1 secondary 2NO3 -> 4L7F; JNK2 sole 3E7O (dropped 7N8T AMP)
# Table: data/structures/docking_ensemble_pdb.csv

version: 2
inhibitor_type: type_I_ATP_competitive
conformation_filter:
  dfg: in
  ac_helix: in

scoring:
  selectivity: Score_JNK1 - max(Score_JNK2, Score_JNK3)
  formulas:
    Score_JNK1: mean(dock_3ELJ, dock_4L7F)
    Score_JNK2: dock_3E7O
    Score_JNK3: mean(dock_3TTI, dock_4WHZ)

validation_gate:
  required_before_screening: true
  co_crystal_redock_rmsd_angstrom:
    default: 2.0
  benchmark_direction_compounds:
    - SP600125
    - CC-930
    - TCS_JNK_6O
    - E1
  on_failure: drop_structure_from_ensemble

structures:
  - isoform: JNK1
    pdb_id: 3ELJ
    gene: MAPK8
    uniprot: P45983
    chain: A
    klifs_model: A
    ligand_ccd: GS7
    resolution_angstrom: 1.80
    klifs_quality_score: 9.3
    missing_residues: 1
    ensemble_role: primary
    grid_reference_ligand: true

  - isoform: JNK1
    pdb_id: 4L7F
    gene: MAPK8
    uniprot: P45983
    chain: A
    klifs_model: A
    ligand_ccd: 1V5
    resolution_angstrom: 1.95
    klifs_quality_score: 9.8
    missing_residues: 0
    missing_atoms: 2
    ensemble_role: secondary
    grid_reference_ligand: true
    notes: Single-chain monomer; no JIP1 scaffold peptide

  - isoform: JNK2
    pdb_id: 3E7O
    gene: MAPK9
    uniprot: P45984
    chain: A
    klifs_model: A
    ligand_ccd: 35F
    resolution_angstrom: 2.14
    klifs_quality_score: 8.0
    missing_residues: 0
    ensemble_role: sole
    grid_reference_ligand: true
    notes: Use chain A only; chain B has gaps in activation loop (res 172-179)

  - isoform: JNK3
    pdb_id: 3TTI
    gene: MAPK10
    uniprot: P53779
    chain: A
    klifs_model: A
    ligand_ccd: KBI
    resolution_angstrom: 2.20
    klifs_quality_score: 8.0
    missing_residues: 0
    ensemble_role: primary
    grid_reference_ligand: true

  - isoform: JNK3
    pdb_id: 4WHZ
    gene: MAPK10
    uniprot: P53779
    chain: A
    klifs_model: A
    ligand_ccd: 3NL
    resolution_angstrom: 1.79
    klifs_quality_score: 8.0
    missing_residues: 0
    ensemble_role: secondary
    grid_reference_ligand: true

alternates:
  JNK1:
    - pdb_id: 2NO3
      reason: Not recommended — 3.20 Å resolution; dual kinase copies + JIP1 peptide
  JNK2:
    - pdb_id: 7N8T
      reason: Not recommended — AMP nucleotide holo (not drug co-crystal); same paper as covalent 8ELC
    - pdb_id: 8ELC
      reason: Not recommended — covalent inhibitor YL2056 bound to Cys116
    - pdb_id: 3NPC
      reason: Not recommended — DFG-out (Type II); do not mix with Type I panel
  JNK3:
    - pdb_id: 2WAJ
      reason: JNK3-selective isoquinoline co-crystal; KLIFS Q=7.2 if 4WHZ fails validation
    - pdb_id: 3FI2
      reason: Not recommended — KLIFS Q=5.6 and 6 missing residues

excluded_misannotations:
  - pdb_id: 4L00
    actual: JAK1 pseudokinase domain (apo)
  - pdb_id: 8AS3
    actual: Arrestin2 + CCR5 phosphopeptide + Fab30
  - pdb_id: 4OBO
    actual: MAP4K4
