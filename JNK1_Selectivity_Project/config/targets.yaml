# ChEMBL target definitions for human JNK isoforms
# Used by scripts/01_download_chembl_data.py

targets:
  JNK1:
    chembl_id: CHEMBL2276
    gene: MAPK8
    uniprot: P45983
    pref_name: Mitogen-activated protein kinase 8
    aliases: [JNK1, SAPK1, PRKM8]

  JNK2:
    chembl_id: CHEMBL4179
    gene: MAPK9
    uniprot: P45984
    pref_name: Mitogen-activated protein kinase 9
    aliases: [JNK2, SAPK2, PRKM9]

  JNK3:
    chembl_id: CHEMBL2637
    gene: MAPK10
    uniprot: P53779
    pref_name: Mitogen-activated protein kinase 10
    aliases: [JNK3, SAPK3, PRKM10]

# Data curation — global defaults
curation:
  pactivity_min: 4.0
  pactivity_max: 10.0
  max_std: 0.5
  max_range: 1.0

# Per-isoform assay harmonization (compounds per assay threshold)
# Tuned to balance data size vs assay consistency for R² > 0.7
curation_per_isoform:
  JNK1:
    min_assay_compounds: 50   # n≈444, holdout R²≈0.70
  JNK2:
    min_assay_compounds: 8    # n≈610, best compromise for JNK2 heterogeneity
  JNK3:
    min_assay_compounds: 20   # n≈1147, holdout R²≈0.77

# Model training defaults
training:
  cv_folds: 5
  xgboost:
    n_estimators: 2500
    max_depth: 7
    learning_rate: 0.015
    subsample: 0.85
    colsample_bytree: 0.65
    min_child_weight: 3
    reg_alpha: 0.8
    reg_lambda: 2.5
    early_stopping_rounds: 100
  chemprop:
    epochs: 100
    batch_size: 50
    patience: 20
    ffn_hidden_dim: 500
    depth: 4

activity_types:
  - IC50
  - Ki
  - Kd
  - EC50

# Assay confidence filter (ChEMBL assay confidence score)
min_assay_confidence: 6

# Selectivity thresholds (log10 molar units, i.e. ΔpActivity)
selectivity:
  delta_log_threshold: 0.35      # ~2.2-fold selectivity (data-driven for paired labels)
  jnk1_active_threshold_pchembl: 6.0   # ~1 µM
  jnk23_inactive_threshold_pchembl: 6.0  # JNK2/3 below this when labeled selective
  jnk1_min_for_delta: 5.5        # minimum JNK1 pActivity to compute delta labels

# Virtual screening funnel (06_virtual_screening.py)
# F1 calibrated on data/benchmarks/literature_benchmarks.csv (9 compounds, 100% recall)
screening:
  p_family_threshold: 6.0        # max(pred_JNK1, pred_JNK2, pred_JNK3) >= threshold
  sa_max: 6.0                    # synthetic accessibility (lower = easier)
  qed_min: 0.35
  scoring_weights:
    w_p_family: 0.55
    w_pAct_JNK1: 0.15            # tie-break toward JNK1 without ML selectivity filter
    w_qed: 0.20
    w_sa: 0.10                   # rewards lower SA (applied as (10 - sa) / 10)

# Benchmark compounds for retrospective validation
# Full panel: data/benchmarks/literature_benchmarks.csv
benchmarks:
  - name: CC-90001
    role: JNK1-biased
    chembl_id: CHEMBL3989871
  - name: SP600125
    role: pan-JNK
    chembl_id: CHEMBL471
  - name: JNK-IN-8
    role: JNK1/JNK2 covalent
    chembl_id: CHEMBL1088639
  - name: BIRB-796
    role: p38/JNK dual (JNK2-strong)
    chembl_id: CHEMBL261
