# DualFourClass BindingDB-native external-slice contract
# Frozen 2026-08-26 BEFORE docking and BEFORE inspecting independent class counts
# as docking results. Supply counts below are generated by the same script after
# these rules are applied; they do not change the rules.
#
# This file is Phase 1 of Dual_Target_Docking/docs/JCIM_NO_WETLAB_DEEP_PLAN_V2.md.
# No docking. A slice is packaged as "external evaluation" only if the gates
# below pass for at least two primary pairs.

name: DualFourClass-BindingDB-native-slice
version: v1
frozen_date: "2026-08-26"
seed: 20260729
theta_pchembl: 6.0
no_docking: true
claim_if_gates_fail: four-pair formulation audit
not_claimed_even_if_gates_pass_without_docking:
  - external evaluation
  - database-external docking validation
  - prospective utility

bindingdb_archive:
  release: "202608"
  updated: "2026-07-31"
  base_url: "https://www.bindingdb.org/rwd/bind/downloads"
  files:
    - BindingDB_BindingDB_Articles_202608_tsv.zip
    - BindingDB_Patents_202608_tsv.zip
    - BindingDB_Assays_202608_tsv.zip
    - BindingDB_rsid_eaids_202608_tsv.zip

targets:
  EGFR: P00533
  HER2: P04626
  ACHE: P22303
  BCHE: P06276
  PIK3CA: P42336
  PIK3CB: P42338
  MTOR: P42345
  MCL1: Q07820
  BCL2L1: Q07817

pairs:
  - name: EGFR/HER2
    A: EGFR
    B: HER2
    role: thin_replication_if_15_to_19_else_primary_if_ge_20
  - name: AChE/BChE
    A: ACHE
    B: BCHE
    role: primary_external
  - name: PIK3CA/PIK3CB
    A: PIK3CA
    B: PIK3CB
    role: backup_not_preferred
  - name: PIK3CA/mTOR
    A: PIK3CA
    B: MTOR
    role: primary_external_if_EGFR_fails
  - name: MCL1/Bcl-xL
    A: MCL1
    B: BCL2L1
    role: ppi_bh3_domain_shift_not_disparate_fold
    note: >
      Homologous BCL-2 family fold. Value is non-ATP PPI/BH3 groove plus
      LC6 compound-10 crystals 3WIY/3WIZ, not a first non-kinase pair
      (AChE/BChE already is).

independence_definition:
  curation_keep_substrings:
    - BindingDB
    - Patent
  curation_drop_substrings:
    - ChEMBL
    - PubChem
    - PDSP
    - CSAR
  species_keep:
    - Homo sapiens
    - Human
  wild_type_only_in_primary: true
  endpoints_primary: [IC50, Ki, Kd]
  relation_primary: "="
  both_ends_measured: true
  missing_not_inactive: true
  structure: largest_organic_fragment_standard_inchikey
  drop_shared_literature: true
  drop_shared_inchikey_with:
    - K4_scored_panels
    - unused_pool_holdout
    - PM110
    - theta6_chembl_maps_of_the_same_pair
  primary_chemical_independence: max_ecfp4_tanimoto_to_development_lt_0.70
  chemical_strata: ["<0.50", "0.50-0.70", ">=0.70"]
  aggregation:
    within_ligand_target_endpoint: median_of_exact_values
    discordant_same_endpoint_across_theta: exclude_from_primary
    across_endpoints_primary: median_of_endpoint_medians
  sensitivities_not_for_shopping:
    - strict_6.5_5.5
    - Ki_Kd_only
    - IC50_only

gates:
  primary_external_pair:
    n_dual: 20
    n_A_only: 20
    n_B_only: 20
    n_sources_per_class: 3
    max_single_document_ligand_fraction: 0.50
  neither_for_formulation: 10
  thin_replication:
    n_per_directional_class: 15
    note: EGFR/HER2 15-19 is thin; do not enter cross-pair summary
  min_qualified_combination:
    - AChE/BChE + PIK3CA/mTOR as two primary pairs
    - or EGFR/HER2 + AChE/BChE both at primary gate
  packaging_as_external_evaluation_requires:
    - at least two primary pairs passing A1 and A3
    - panel freeze commit and sha256 before docking
    - document/scaffold cluster uncertainty after docking
    - immutable DOI of data/code/receptors/poses
    - report support, chance, or reversal in full
  this_cloud_session: no_docking_so_cannot_package_external_evaluation

mcl1_bclxl:
  primary_receptors: {MCL1: 3WIY, BCL2L1: 3WIZ}
  pose_gold_ligand: LC6
  pose_gold_compound: compound_10_Tanaka_JMC_2013
  not_compound_11: true
  chembl_panel_target: 24/24/24/24 at theta 6.0
  b_only_is_exhaustive: true
  no_independent_same_library_holdout: true
  pose_gold_gate_before_panel_docking:
    best_of_top3_rmsd_A: 2.0
    physical_validity: required
  if_gate_fails: applicability_stress_test_not_screening_evidence

docking_if_later_local:
  vina: "1.2.7"
  exhaustiveness: 8
  reuse_frozen_receptors_boxes_ligand_prep: true
  no_box_or_receptor_shopping_after_seeing_external_auroc: true
  primary_metrics:
    - pocket_matched_AUROC_D_vs_A
    - pocket_matched_AUROC_D_vs_B
    - summary_min
  extra_reporting: [AUPRC, n, failure_rate, document_cluster_bootstrap, scaffold_cluster_bootstrap]
  interpretation:
    similar_to_main: transferable_failure_mode
    near_0.5: conclusion_depends_on_panel_or_source
    reversed: keep_and_rewrite_if_no_error
