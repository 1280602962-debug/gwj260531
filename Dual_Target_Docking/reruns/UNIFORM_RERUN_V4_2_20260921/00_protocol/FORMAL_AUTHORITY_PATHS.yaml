# Parsed and frozen BEFORE any historical-error regression test.
# Do not refer to these as "the adjudicated table". Use these paths only.
# Path strings are relative to PROJECT_ROOT = Dual_Target_Docking/.
# Resolve as PROJECT_ROOT / relative_path. PROJECT_ROOT comes from
# --project-root or from the script location, not from the process cwd.
# This file is the current normative path authority. It does not record
# the original /tmp/pr39_fiveseed runtime resolution.
protocol: FORMAL_AUTHORITY_PATHS
run_id: UNIFORM_RERUN_V4_2_20260921
parsed_before_regression: true
path_form: PROJECT_ROOT_relative
PROJECT_ROOT_definition: Dual_Target_Docking directory

# --- labels / identity (V4.2 formal) ---
activity_fourclass_and_eligibility: reruns/UNIFORM_RERUN_V4_2_20260921/00_protocol/pair_ligand_mapping.csv
activity_columns_used: [pair, panel_id, global_ligand_entity_id, canonical_ligand_id, parent_independent, parent_role, analysis_set, class, activity_eligible, holdout_eligible, prepare_3d]
alias_registry: reruns/UNIFORM_RERUN_V4_2_20260921/00_protocol/parent_alias_registry.csv
holdout_membership: reruns/UNIFORM_RERUN_V4_2_20260921/00_protocol/holdout_membership_freeze.csv
global_ligand_registry: reruns/UNIFORM_RERUN_V4_2_20260921/00_protocol/global_ligand_registry.csv
fold_scaffold_assignments: results/canonical/model_fold_assignments.csv
fold_usage_rule: >
  fold_scaffold_assignments is the unique fold_id/scaffold file.
  Formal analysis must drop alias rows using parent_alias_registry
  (AB_040 is DUPLICATE_PARENT_ALIAS of AB_046; AB_046 fold_id=1).
  The fold file still contains an AB_040 row; that row is not an independent observation.

