protocol:
  name: M3_MACROCYCLE_INPUT_REPAIR_ADDENDUM
  run_id: UNIFORM_RERUN_V4_2_20260921
  written_before_redocking: true
  auroc_used: false
  score_used_for_selection: false
  cherry_pick_forbidden: true

source_of_affected_set: 13_qa/GNINA_LIGAND_REPRESENTATION_AUDIT.csv + 13_qa/M3_MACROCYCLE_TOPOLOGY_DECISION.csv
selection_basis: input_topology_audit_only

cgn_vs_gn:
  CGn: real_atom_never_discard
  Gn: glue_pseudoatom_only
  historical_conversion: CG0_to_C_drop_G0
  historical_conversion_is_lossless: false
  ring_closure_proof: frozen_SDF_connectivity_plus_SMILES_IDX_plus_torsion_tree
  cartesian_distance_is_not_proof: true

decision_rule:
  M3_INPUT_TOPOLOGY_PASS: retain_original_M3
  M3_INPUT_TOPOLOGY_FAIL: original_jobs_INVALID_INPUT_REPRESENTATION_not_TIMEOUT

unaffected:
  use: 10_gnina_independent_docking/GNINA_SEED42_PRODUCTION_MASTER_REPARSED.csv
  original_TIMEOUT_ligand: NPHIQFCGKIKGSA-YQOHNZFASA-N
  original_TIMEOUT_jobs: [4EY7__NPHIQFCGKIKGSA-YQOHNZFASA-N__seed42, 4BDS__NPHIQFCGKIKGSA-YQOHNZFASA-N__seed42]
  TIMEOUT_topology: M3_INPUT_TOPOLOGY_PASS_not_special_type
  TIMEOUT_action: keep_missing_no_rescue

repair:
  chemistry_source: 02_ligands/sdf/{eid}.sdf
  keep: [protonation, tautomer, formal_charge, stereo, frozen_3D_starting_conformation]
  meeko: 0.7.1
  meeko_flags: [--rigid_macrocycles, --add_index_map]
  forbidden: [ETKDG, MMFF, UFF, reprotonate, reconformer]
  gnina: v1.3.2 master:f23dd2b
  seed: 42
  exhaustiveness: 16
  num_modes: 9
  cpu: 1
  flags: [--no_gpu, --scoring, vina, --cnn_scoring, rescore, --pose_sort_order, CNNscore]
  timeout_s: 2400
  concurrency: 2
  retry: one_identical_parameter_retry
  old_invalid_outputs: retain_for_provenance_do_not_enter_official_M3
  no_score_choice_between_old_and_new: true

