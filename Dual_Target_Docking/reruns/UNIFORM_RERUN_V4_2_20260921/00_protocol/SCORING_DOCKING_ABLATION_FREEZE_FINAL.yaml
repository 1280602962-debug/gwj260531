  JAK1/TYK2: [6N7A, 3LXP]
  PIK3CA/mTOR: [4L23, 4JT6]
  AChE/BChE: [4EY7, 4BDS]
  F2/F10: [4UDW, 2JKH]
  PPARG/PPARA: [9V8H, 6LXA]
  PPARA/PPARD: [6LXA, 5U3Q]
