ablation_rules:
  replace_one_receptor_per_design: true
  forbid_direct_A1B1_vs_A2B2_as_the_only_contrast: true
  A2B2_only_after_A2B1_and_A1B2_accounted: true
  perturbation_ladder_only_if_both_NEAR_and_FAR_CLEAN_alts_frozen_before_any_result: true
  no_CLEAN_FAR_ladder_currently_available_except_optional_EGFR_HER2_FAR_arm: true
  do_not_search_A3_after_seeing_A2: true

future_docking_protocol_if_later_authorized:
  ligand_population: identical_to_primary
  ligand_assets: reuse_v4_2
  activity_labels: identical
  analysis_population_definition: unchanged
  vina: "1.2.7"
  scoring: vina
  exhaustiveness: 16
  num_modes: 9
  energy_range: 6
  primary_seed: 42
  seeds_if_five_seed_used: [17, 29, 42, 71, 101]
  primary_score: negative_mode1_affinity
  forbid_best_seed: true
  forbid_best_pose_as_primary: true
  forbid_box_adjust_from_redock_rmsd: true
  forbid_protonation_his_ptr_adjust_from_results: true
  forbid_changing_primary_receptor_from_alternative_performance: true
  box_from_alternative_cognate_only: true
  box_pad_rule: frozen_v4_2_BOX_PAD_A_5.0
  prep: PDBFixer_heavy_then_Meeko_0.7.1_no_Reduce2
  forbidden_meeko_flags_remain_forbidden: true
  required_qc_before_production_per_alternative:
    - identity_audit
    - component_policy_audit
    - box_audit
    - cognate_redocking_technical_QC
  redocking_is_not_an_AUROC_filter: true

future_estimands_if_later_authorized:
  A_side_replacement: recompute_only_metrics_that_depend_on_score_A_or_A_B_combo
  B_side_replacement: recompute_only_metrics_that_depend_on_score_B_or_A_B_combo
  keep_unreplaced_directional_arm: true
  examples_A_side:
    - dual_vs_B_only_using_score_A
    - summary_min
    - score_mean_ranking
    - TopK
    - AND_filter
  receptor_effect:
    delta_AUC_A_receptor: AUC(A2/B1) - AUC(A1/B1)
    delta_AUC_B_receptor: AUC(A1/B2) - AUC(A1/B1)
    delta_summary_min_A: summary_min(A2/B1) - summary_min(A1/B1)
    delta_summary_min_B: summary_min(A1/B2) - summary_min(A1/B1)
  comparison_design: paired_on_identical_ligand_population_and_identical_bootstrap_indices
  forbid_independent_bootstrap_then_CI_overlap_test: true

analysis_code_identity_test:
  status: SPECIFIED_NOT_EXECUTED
  purpose: prove_pipeline_does_not_create_a_false_receptor_effect
  input: existing_A1_B1_primary_score_master
  action: rerun_only_the_receptor_sensitivity_analysis_codepath
  must_match_primary_pipeline:
    - sample_membership
    - scores
    - directional_mapping
    - AUROC_inputs
    - TopK_sort_inputs
    - bootstrap_indices
  produces_new_scientific_result: false
  authorized_now: false

historically_exposed_rule:
  field: HISTORICALLY_EXPOSED_CANDIDATE
  values: [YES, NO]
  participates_in_selection: false
  meaning: named_in_old_manifest_or_prior_structural_discussion
  do_not_exclude_4JPS_or_4JSX_for_history: true

human_must_decide:
  - family_1_option_K1_or_K2
  - mTOR_B2_4JT5_or_4JSX_if_K1
  - JAK1_4EI4_copy_if_K2
  - whether_to_keep_optional_EGFR_HER2_FAR_arm
  - pocket_cutoff_A_among_4.0_4.5_5.0

human_confirmation_required_before:
  - alternative_receptor_preparation
  - alternative_docking
  - AUROC
  - adding_any_PDB_to_production_primary_set
  - analysis_code_identity_test_execution
