run_id: UNIFORM_RERUN_V4_2_20260921
document: ALTERNATIVE_RECEPTOR_EXPERIMENT_FREEZE_V2
supersedes: ALTERNATIVE_RECEPTOR_EXPERIMENT_FREEZE.yaml
overwrites_v1: false
status: DESIGN_FROZEN_AWAITING_HUMAN_CONFIRMATION
docking_authorized: false
receptor_prep_authorized: false
redocking_authorized: false
auroc_authorized: false
primary_receptors_may_be_modified: false
predicted_structures_allowed: false
performance_used_for_selection: false
phase5_rmsd_used_for_selection: false
legacy_or_v42_scores_opened: false
new_pdb_search_after_v2: forbidden

purpose: >
  Re-verify planned alternative receptors from RCSB/mmCIF/validation/papers,
  split COMPARABILITY_TIER from POCKET_PERTURBATION, freeze one-receptor-at-a-time
  ablation designs, and pre-register the later docking and paired-delta analysis
  protocol. This is not a search for a receptor that improves AUROC.

sources_used:
  - 00_protocol/receptor_registry.csv
  - 00_protocol/receptor_component_policy.csv
  - 00_protocol/analysis_freeze.yaml (identity / component / alternative ID list only)
  - 00_protocol/alternative_receptor_manifest.csv (ID list only; score files not opened)
  - 13_qa/ALTERNATIVE_RECEPTOR_SELECTION.md (V1; fact-checked, not trusted)
  - RCSB mmCIF under 13_qa/alt_cif
  - wwPDB validation XML
  - primary structure papers via DOI/PMID in FACT_VERIFICATION_V2

sources_forbidden_and_not_opened:
  - any AUROC / summary_min / Top-K / EF table
  - Phase 5 redocking RMSD as a selector
  - Phase 7 affinities as selection input
  - LEGACY current_score_master scores
  - deposited alternative score CSVs named in the prior manifest
  - GNINA / RTMScore tables

pocket_definition:
  status: CANDIDATES_NOT_SILENTLY_CHOSEN
  protocol_frozen_box_pad_A: 5.0
  protocol_frozen_pocket_cutoff_A: null
  rule: primary_cognate_any_heavy_atom_distance
  candidate_cutoffs_A: [4.0, 4.5, 5.0]
  same_residue_set_for_all_alts_of_a_target: true
  do_not_pick_cutoff_after_seeing_rmsd: true
  predeclared_pocket_bins:
    NEAR: "bb_CA_RMSD < 1.5"
    INTERMEDIATE: "bb_CA_RMSD <= 3.0"
    FAR: "bb_CA_RMSD > 3.0"
    NOT_ASSESSABLE: cannot_quantify_stably

comparability_tier:
  CLEAN: same_target_domain_site_construct_partner_no_key_pocket_mutation
  MODERATE: site_correct_but_distal_mutation_or_small_construct_or_noncritical_partner_diff
  CONFOUNDED: construct_partner_activation_PTM_site_mutation_or_domain_state_prevents_conformation_only_claim

